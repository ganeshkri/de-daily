name: Update reading list

on:
  schedule:
    - cron: "43 0 * * *"    # daily at 06:13 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python scripts/fetch_feeds.py
      - name: Commit if changed
        run: |
          git config user.name "de-daily bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reading.json
          git diff --cached --quiet || (git commit -m "Update reading list $(date -u +%F)" && git push)
