<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DE Daily</title>
  <meta name="description" content="One data engineering interview problem a day — SQL, Snowflake, dbt, Airflow, Python, Architecture">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DE Daily">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="code.css">
</head>
<body>
  <header class="hero">
    <div class="hero-row">
      <div>
        <h1 id="heroTitle">DE Daily</h1>
        <p id="heroSub" class="hero-sub">Loading…</p>
      </div>
      <div id="streak" class="streak" title="Daily streak">🔥 0</div>
    </div>
    <div id="heroExtra"></div>
  </header>

  <main>
    <section id="view-today" class="view"></section>
    <section id="view-library" class="view" hidden></section>
    <section id="view-reading" class="view" hidden></section>
    <section id="view-progress" class="view" hidden></section>
  </main>

  <!-- full-screen problem viewer used by Library and reviews -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bar">
      <button id="sheetBack" class="back" type="button">‹ Back</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>

  <nav class="tabs" aria-label="Sections">
    <button data-view="today" class="tab active" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>Today</button>
    <button data-view="library" class="tab" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.2 4.6l3.8-1 3.6 15.4-3.8 1z"/></svg>Library</button>
    <button data-view="reading" class="tab" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 4h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg>Reading</button>
    <button data-view="progress" class="tab" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zm6 0V4h3v16zm6 0v-7h3v7z"/></svg>Progress</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
